services:
  postgres:
    image: postgres:16
    container_name: mywheel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mywheel
      POSTGRES_PASSWORD: mywheel
      POSTGRES_DB: mywheel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  # 기존 db/docker-compose.yml(project: db)로 만들어졌던 db_pgdata 볼륨을 그대로 재사용 (데이터 유지)
  pgdata:
    
    name: db_pgdata

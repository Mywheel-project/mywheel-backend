services:
  postgres:
    image: postgres:16
    container_name: mywheel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mywheel
      POSTGRES_PASSWORD: mywheel
      POSTGRES_DB: mywheel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
